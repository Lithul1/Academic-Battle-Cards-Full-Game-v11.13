name: Tests

# Every pull request into main is built and tested before anyone merges it.
#
# The game is one self-contained HTML file, so "staging" a PR needs no server:
# the runner builds the PR's own src into dist/stub.html (1x1 images, no
# assets.json) and tests that. What gets tested is exactly the code under
# review -- for a pull_request event GitHub checks out the PR merged onto main.
#
# Two jobs, so the PR shows two separate checks:
#   engine   -- npm test: script compile, card-text checks, battle suites (jsdom)
#   browser  -- npm run test:e2e: Playwright in real Chromium
#
# Needs no secrets, so it works the same for PRs from forks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # jsdom 30 needs Node 22.22+; 24 is the current LTS
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run engine tests
        run: npm test

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # list for the log, html for the downloadable report
      - name: Run Playwright tests
        run: npx playwright test --reporter=list,html

      # Keep the report on pass and fail, so a green run is still inspectable.
      # Download it from the run's Summary page, unzip, then
      #   npx playwright show-report <folder>
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Traces and screenshots of failed attempts. Uploaded even when the run
      # passes: a test that failed once and passed on retry ("flaky") leaves
      # its evidence here too. Nothing failed -> nothing to upload.
      - name: Upload test-results (traces, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 30
